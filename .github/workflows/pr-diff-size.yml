name: Packages size analysis

on:
  workflow_run:
    workflows: ['Build & Test']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  analyze:
    if: >
      github.repository == 'rameel/ramstack.alpinegear.js'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Run size comparison
        run: |
          node .github/workflows/scripts/compare-packages-size.js > comment.md

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('./comment.md', 'utf8');
            const pr_number = context.payload.workflow_run.pull_requests[0].number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number
            });

            const marker = "### 📦 Bundle size comparison";
            const existing_comment = comments.find(c => c.body.includes(marker));

            if (existing_comment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing_comment.id,
                body: body
              });
            }
            else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              })
            }
