name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[a-z]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'rameel/ramstack.alpinegear.js'
    name: 'Publish Packages'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        run: |
          for dir in dist/*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              package="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"

              if npm view "$package" version --json > /dev/null 2>&1; then
                echo "Skipping $package: version already exists."
              else
                npm publish --access public
              fi

              cd - > /dev/null
            fi
          done

      - name: Archive packages (.zip)
        run: zip -r ramstack.alpinegear-${{ github.ref_name }}.zip ./dist/*

      - name: Archive packages (.tar.gz)
        run: tar -czvf ramstack.alpinegear-${{ github.ref_name }}.tar.gz ./dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ramstack.alpinegear-${{ github.ref_name }}.zip
            ramstack.alpinegear-${{ github.ref_name }}.tar.gz
